[build]
  command = "./build.sh"

# https://answers.netlify.com/t/web-application-manifest-mime-type/34110
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/github"
  to = "https://github.com/miXwui"
  status = 301
  force = true

[[redirects]]
  from = "/linkedin"
  to = "https://www.linkedin.com/in/miXwui/"
  status = 301
  force = true
